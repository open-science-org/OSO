<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 808" width="1290" height="808" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1d1c1a">
  <title>OSO research-community model: one world, one population of agents, two rule settings</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4843"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6f5e"/>
    </marker>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2f6f5e" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1290" height="808" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="22" font-weight="700">One model, two rule settings: traditional research vs. OSO</text>
  <text x="30" y="63" font-size="14" fill="#5f5d58">Same world, same agents, same budget $X. Only the rules (bottom left) differ. Numbers in brackets are sections of the model.</text>

  <!-- ===== 1. Funder and budgets ===== -->
  <rect x="30" y="90" width="200" height="70" rx="10" fill="#f4f2ee" stroke="#d6d2ca"/>
  <text x="130" y="118" text-anchor="middle" font-weight="700" font-size="15">Funder</text>
  <text x="130" y="140" text-anchor="middle">spends $X in total</text>
  <text x="130" y="155" text-anchor="middle" font-size="11" fill="#5f5d58">X_t = X / T per round [2.5]</text>

  <line x1="130" y1="160" x2="130" y2="218" stroke="#4a4843" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="30" y="222" width="200" height="200" rx="10" fill="#ffffff" stroke="#d6d2ca"/>
  <text x="130" y="248" text-anchor="middle" font-weight="700" font-size="15">Compute budgets [2.5]</text>
  <text x="130" y="268" text-anchor="middle" font-size="11.5">b_i = X_t·[(1−ρ)/N + ρ·Ē_i / ΣĒ]</text>
  <text x="130" y="285" text-anchor="middle" font-size="11" fill="#5f5d58">ρ = 0 equal grants · ρ = 1 by earnings</text>
  <!-- bars -->
  <g fill="#2f6f5e" opacity="0.85">
    <rect x="55" y="355" width="18" height="50"/>
    <rect x="80" y="330" width="18" height="75"/>
    <rect x="105" y="375" width="18" height="30"/>
    <rect x="130" y="345" width="18" height="60"/>
    <rect x="155" y="385" width="18" height="20"/>
    <rect x="180" y="392" width="18" height="13"/>
  </g>
  <line x1="50" y1="405" x2="205" y2="405" stroke="#4a4843"/>
  <text x="130" y="320" text-anchor="middle" font-size="11" fill="#5f5d58">compute per agent this round</text>

  <!-- arrow budgets -> agents -->
  <line x1="230" y1="320" x2="256" y2="320" stroke="#4a4843" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== 2. Agents ===== -->
  <rect x="260" y="90" width="260" height="440" rx="10" fill="#ffffff" stroke="#d6d2ca"/>
  <text x="390" y="116" text-anchor="middle" font-weight="700" font-size="15">AI research agents [4]</text>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="#5f5d58">a mix of archetypes (Claude, GPT, open models)</text>
  <g font-size="12.5">
    <circle cx="285" cy="160" r="9" fill="#2f6f5e"/><text x="302" y="164"><tspan font-weight="700">Foundation builder</tspan> patient, shares</text>
    <circle cx="285" cy="188" r="9" fill="#c2410c"/><text x="302" y="192"><tspan font-weight="700">Target racer</tspan> risk-seeking, hoards</text>
    <circle cx="285" cy="216" r="9" fill="#2563eb"/><text x="302" y="220"><tspan font-weight="700">Cheap explorer</tspan> low cost, explores</text>
    <circle cx="285" cy="244" r="9" fill="#7c3aed"/><text x="302" y="248"><tspan font-weight="700">Specialist</tspan> strong in one area</text>
    <circle cx="285" cy="272" r="9" fill="#a16207"/><text x="302" y="276"><tspan font-weight="700">Free rider</tspan> reuses, never shares</text>
    <circle cx="285" cy="300" r="9" fill="#6b6862"/><text x="302" y="304"><tspan font-weight="700">Gamer</tspan> farms trivial results</text>
  </g>
  <line x1="278" y1="322" x2="502" y2="322" stroke="#e4e1db"/>
  <text x="278" y="342" font-weight="700" font-size="12.5">Each agent has eight traits</text>
  <g font-size="12">
    <text x="278" y="362">s  skill per area</text>
    <text x="278" y="380">q  conjecture quality</text>
    <text x="278" y="398">k  cost per attempt</text>
    <text x="278" y="416">δ  time horizon</text>
    <text x="398" y="362">γ  risk attitude</text>
    <text x="398" y="380">ω  reuse of others' work</text>
    <text x="398" y="398">β  sharing disposition</text>
    <text x="398" y="416">g  gaming</text>
  </g>
  <line x1="278" y1="432" x2="502" y2="432" stroke="#e4e1db"/>
  <text x="278" y="452" font-weight="700" font-size="12.5">Each attempt [4.2]</text>
  <text x="278" y="471" font-size="12">picks a reachable result r by score U_i(r):</text>
  <text x="278" y="489" font-size="12">chance × (mint + bounty + δ·expected flow-back)</text>
  <text x="278" y="507" font-size="12">− risk; and decides whether to publish it</text>

  <!-- arrow agents -> problem space -->
  <line x1="520" y1="320" x2="546" y2="320" stroke="#4a4843" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="533" y="306" text-anchor="middle" font-size="10.5" fill="#5f5d58">attempt</text>

  <!-- ===== 3. Problem space ===== -->
  <rect x="550" y="90" width="330" height="440" rx="10" fill="#fbfaf8" stroke="#d6d2ca"/>
  <text x="715" y="116" text-anchor="middle" font-weight="700" font-size="15">Research tree: hidden DAG [2.1]</text>
  <text x="715" y="134" text-anchor="middle" font-size="11" fill="#5f5d58">targets and bounties are public; the paths are not</text>
  <g font-size="10.5" fill="#5f5d58" text-anchor="middle">
    <text x="585" y="156">level 1</text><text x="648" y="156">2</text><text x="715" y="156">3</text><text x="780" y="156">4</text><text x="845" y="156">5</text>
  </g>
  <text x="715" y="172" text-anchor="middle" font-size="10.5" fill="#5f5d58">harder →  (success chance p_r = p₀·η^level)</text>

  <!-- edges (prerequisite structure) -->
  <g stroke="#9a968e" stroke-width="1.4" fill="none">
    <line x1="590" y1="200" x2="650" y2="225"/>
    <line x1="590" y1="270" x2="650" y2="225"/>
    <line x1="590" y1="270" x2="650" y2="320"/>
    <line x1="590" y1="345" x2="650" y2="320"/>
    <line x1="590" y1="420" x2="650" y2="420"/>
    <line x1="650" y1="225" x2="715" y2="270"/>
    <line x1="650" y1="320" x2="715" y2="270"/>
    <line x1="650" y1="320" x2="715" y2="365"/>
    <line x1="650" y1="225" x2="715" y2="200"/>
    <line x1="715" y1="200" x2="780" y2="205" stroke-dasharray="4 3"/>
    <line x1="715" y1="270" x2="780" y2="320" stroke-dasharray="4 3"/>
    <line x1="715" y1="365" x2="780" y2="320" stroke-dasharray="4 3"/>
    <line x1="780" y1="320" x2="845" y2="320" stroke-dasharray="4 3"/>
  </g>
  <!-- nodes -->
  <g stroke-width="1.6">
    <circle cx="590" cy="200" r="11" fill="#2f6f5e" stroke="#2f6f5e"/>
    <circle cx="590" cy="270" r="11" fill="#2f6f5e" stroke="#2f6f5e"/>
    <circle cx="590" cy="345" r="11" fill="#2f6f5e" stroke="#2f6f5e"/>
    <circle cx="590" cy="420" r="11" fill="#2f6f5e" stroke="#2f6f5e"/>
    <circle cx="650" cy="225" r="11" fill="#2f6f5e" stroke="#2f6f5e"/>
    <circle cx="650" cy="320" r="11" fill="url(#hatch)" stroke="#2f6f5e"/>
    <circle cx="650" cy="420" r="11" fill="#d6d2ca" stroke="#9a968e"/>
    <circle cx="715" cy="200" r="11" fill="#ffffff" stroke="#9a968e" stroke-dasharray="3 2"/>
    <circle cx="715" cy="365" r="11" fill="url(#hatch)" stroke="#2f6f5e"/>
    <circle cx="780" cy="205" r="11" fill="#eeece8" stroke="#9a968e" stroke-dasharray="3 2"/>
    <circle cx="780" cy="320" r="11" fill="#ffffff" stroke="#9a968e" stroke-dasharray="3 2"/>
  </g>
  <!-- targets (stars) -->
  <path d="M715,254 l4.7,9.6 10.6,1.5 -7.7,7.5 1.8,10.5 -9.4,-5 -9.4,5 1.8,-10.5 -7.7,-7.5 10.6,-1.5z" fill="#2f6f5e" stroke="#2f6f5e"/>
  <text x="733" y="266" font-size="11" font-weight="700">B₃</text>
  <path d="M845,302 l5.6,11.4 12.6,1.8 -9.1,8.9 2.1,12.5 -11.2,-5.9 -11.2,5.9 2.1,-12.5 -9.1,-8.9 12.6,-1.8z" fill="#ffffff" stroke="#9a968e" stroke-dasharray="3 2"/>
  <text x="845" y="355" text-anchor="middle" font-size="11" font-weight="700">B₅ ≫ B₃</text>
  <!-- trivial pool -->
  <g fill="#e4e1db">
    <circle cx="830" cy="425" r="5"/><circle cx="845" cy="418" r="5"/><circle cx="858" cy="428" r="5"/><circle cx="842" cy="434" r="5"/>
  </g>
  <text x="845" y="451" text-anchor="middle" font-size="10" fill="#5f5d58">trivial pool</text>

  <!-- legend -->
  <g font-size="11">
    <circle cx="572" cy="474" r="6" fill="#2f6f5e"/><text x="583" y="478">proved, published</text>
    <circle cx="700" cy="474" r="6" fill="url(#hatch)" stroke="#2f6f5e"/><text x="711" y="478">proved, kept private</text>
    <circle cx="572" cy="496" r="6" fill="#ffffff" stroke="#9a968e" stroke-dasharray="3 2"/><text x="583" y="500">not yet proved</text>
    <circle cx="700" cy="496" r="6" fill="#d6d2ca" stroke="#9a968e"/><text x="711" y="500">dead end</text>
    <path d="M572,511 l2.6,5.3 5.9,.9 -4.3,4.1 1,5.8 -5.2,-2.7 -5.2,2.7 1,-5.8 -4.3,-4.1 5.9,-.9z" fill="#2f6f5e"/><text x="583" y="522">target with bounty</text>
  </g>

  <!-- arrow problem -> visibility -->
  <line x1="880" y1="320" x2="896" y2="320" stroke="#4a4843" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== 4. Visibility ===== -->
  <rect x="900" y="210" width="110" height="220" rx="10" fill="#ffffff" stroke="#d6d2ca"/>
  <text x="955" y="236" text-anchor="middle" font-weight="700" font-size="14">Visibility V</text>
  <text x="955" y="252" text-anchor="middle" font-size="11" fill="#5f5d58">when proofs are</text>
  <text x="955" y="265" text-anchor="middle" font-size="11" fill="#5f5d58">published [2.3]</text>
  <g font-size="12" text-anchor="middle">
    <rect x="910" y="278" width="90" height="26" rx="13" fill="#fdecdf" stroke="#c2410c"/><text x="955" y="295">finished-only</text>
    <rect x="910" y="312" width="90" height="26" rx="13" fill="#f4f2ee" stroke="#d6d2ca"/><text x="955" y="329">delayed d</text>
    <rect x="910" y="346" width="90" height="26" rx="13" fill="#e3f0ec" stroke="#2f6f5e"/><text x="955" y="363">immediate</text>
    <rect x="910" y="380" width="90" height="26" rx="13" fill="#e3f0ec" stroke="#2f6f5e"/><text x="955" y="397">agent's choice</text>
  </g>
  <text x="955" y="422" text-anchor="middle" font-size="10.5" fill="#5f5d58">first to publish = author</text>

  <!-- arrow visibility -> ledger -->
  <line x1="1010" y1="320" x2="1026" y2="320" stroke="#4a4843" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ===== 5. Ledger ===== -->
  <rect x="1030" y="90" width="230" height="440" rx="10" fill="#ffffff" stroke="#d6d2ca"/>
  <text x="1145" y="116" text-anchor="middle" font-weight="700" font-size="15">Ledger: who gets paid [2.4]</text>
  <text x="1145" y="134" text-anchor="middle" font-size="11" fill="#5f5d58">the OIP-8 / OIP-14 waterfall</text>

  <text x="1145" y="160" text-anchor="middle" font-size="12">bounty B enters target t</text>
  <path d="M1145,170 l4.7,9.6 10.6,1.5 -7.7,7.5 1.8,10.5 -9.4,-5 -9.4,5 1.8,-10.5 -7.7,-7.5 10.6,-1.5z" fill="#2f6f5e"/>
  <text x="1130" y="190" text-anchor="end" font-size="12" font-weight="700" fill="#2f6f5e">author keeps α</text>
  <line x1="1138" y1="200" x2="1090" y2="248" stroke="#2f6f5e" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="1152" y1="200" x2="1200" y2="248" stroke="#2f6f5e" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="1145" y="236" text-anchor="middle" font-size="11.5" fill="#2f6f5e">(1−α)·ŵ</text>
  <circle cx="1085" cy="258" r="10" fill="#2f6f5e"/>
  <circle cx="1205" cy="258" r="10" fill="#2f6f5e"/>
  <text x="1085" y="286" text-anchor="middle" font-size="11">keeps α</text>
  <text x="1205" y="286" text-anchor="middle" font-size="11">keeps α</text>
  <line x1="1085" y1="292" x2="1085" y2="318" stroke="#2f6f5e" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrG)"/>
  <text x="1145" y="314" text-anchor="middle" font-size="11" fill="#5f5d58">… up to the roots</text>
  <circle cx="1085" cy="328" r="8" fill="#2f6f5e"/>

  <line x1="1048" y1="350" x2="1242" y2="350" stroke="#e4e1db"/>
  <text x="1048" y="372" font-size="12" font-weight="700">Mint m per new result</text>
  <text x="1048" y="390" font-size="12">(1−c)·m to its author</text>
  <text x="1048" y="407" font-size="12">c·m to what it built on</text>
  <line x1="1048" y1="420" x2="1242" y2="420" stroke="#e4e1db"/>
  <text x="1048" y="442" font-size="12" font-weight="700">Validation screen θ</text>
  <text x="1048" y="460" font-size="12">rejects trivial results</text>
  <line x1="1048" y1="473" x2="1242" y2="473" stroke="#e4e1db"/>
  <text x="1048" y="494" font-size="12" font-weight="700">Attribution weights ŵ</text>
  <text x="1048" y="512" font-size="12">exact (Lean) or noisy σ_w</text>

  <!-- ===== loop back: earnings -> budgets ===== -->
  <path d="M1145,530 L1145,556 L130,556 L130,426" fill="none" stroke="#2f6f5e" stroke-width="2.2" marker-end="url(#arrG)"/>
  <rect x="510" y="545" width="270" height="22" rx="11" fill="#ffffff"/>
  <text x="645" y="561" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6f5e">earnings buy future compute (ρ)</text>

  <!-- ===== 6. Rules ===== -->
  <rect x="30" y="590" width="600" height="198" rx="10" fill="#f4f2ee" stroke="#d6d2ca"/>
  <text x="50" y="617" font-weight="700" font-size="15">The rules: the only thing that differs [3]</text>
  <g font-size="13">
    <text x="50" y="648" font-weight="700" fill="#5f5d58">Rule</text>
    <text x="330" y="648" font-weight="700" fill="#c2410c">Traditional</text>
    <text x="480" y="648" font-weight="700" fill="#2f6f5e">OSO</text>
    <line x1="50" y1="657" x2="610" y2="657" stroke="#d6d2ca"/>
    <text x="50" y="680">α  share of incoming value a result keeps</text>
    <text x="330" y="680">1</text><text x="480" y="680">0.8</text>
    <text x="50" y="704">c  share of each mint paid to what it built on</text>
    <text x="330" y="704">0</text><text x="480" y="704">0.15</text>
    <text x="50" y="728">V  visibility</text>
    <text x="330" y="728">finished-only</text><text x="480" y="728">immediate or choice</text>
    <line x1="50" y1="740" x2="610" y2="740" stroke="#d6d2ca"/>
    <text x="50" y="760" font-size="12" fill="#5f5d58">Sweeping α finds α*, where sharing becomes the rational choice.</text>
    <text x="50" y="776" font-size="12" fill="#5f5d58">The mixed corners (flow-back without sharing, sharing without flow-back) split the gain.</text>
  </g>

  <!-- ===== 7. Measures ===== -->
  <rect x="650" y="590" width="610" height="198" rx="10" fill="#ffffff" stroke="#d6d2ca"/>
  <text x="670" y="617" font-weight="700" font-size="15">Value, measured on several axes [5]</text>
  <!-- mini chart -->
  <line x1="690" y1="740" x2="900" y2="740" stroke="#4a4843"/>
  <line x1="690" y1="740" x2="690" y2="640" stroke="#4a4843"/>
  <text x="795" y="764" text-anchor="middle" font-size="11" fill="#5f5d58">spend →  $X</text>
  <text x="682" y="690" text-anchor="middle" font-size="11" fill="#5f5d58" transform="rotate(-90 682 690)">hardest level</text>
  <path d="M690,738 L720,728 L750,722 L790,712 L830,706 L870,700 L898,697" fill="none" stroke="#c2410c" stroke-width="2.4"/>
  <path d="M690,738 L715,725 L740,708 L770,690 L800,676 L835,660 L870,650 L898,645" fill="none" stroke="#2f6f5e" stroke-width="2.4"/>
  <text x="903" y="700" font-size="11" fill="#c2410c">traditional</text>
  <text x="903" y="648" font-size="11" fill="#2f6f5e">OSO</text>
  <text x="795" y="636" text-anchor="middle" font-size="10" fill="#9a968e">illustrative, not a result</text>
  <g font-size="12.5">
    <text x="985" y="646"><tspan font-weight="700">Frontier</tspan> hardest level for $X</text>
    <text x="985" y="666"><tspan font-weight="700">Speed</tspan> rounds to reach level L*</text>
    <text x="985" y="686"><tspan font-weight="700">Cost</tspan> spend to reach level L*</text>
    <text x="985" y="706"><tspan font-weight="700">Productivity</tspan> results per $</text>
    <text x="985" y="726"><tspan font-weight="700">Breadth</tspan>, <tspan font-weight="700">Waste</tspan>, <tspan font-weight="700">Reliability</tspan></text>
    <text x="985" y="746"><tspan font-weight="700">Credit accuracy</tspan> pay vs. true</text>
    <text x="985" y="764">contribution in the hidden DAG</text>
  </g>
</svg>
